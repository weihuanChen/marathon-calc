<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tooltip Debug</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        tr {
            cursor: pointer;
            transition: background 0.2s;
        }
        tr:hover {
            background: #e3f2fd !important;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        tr:nth-child(even) {
            background: #f9f9f9;
        }
        .tooltip {
            position: fixed;
            background: white;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 1000;
            max-width: 300px;
        }
        .tooltip-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        .tooltip-content {
            font-size: 14px;
            color: #666;
        }
        .info {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .coordinates {
            font-family: monospace;
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="info">
            <strong>调试信息:</strong> 点击表格行查看 tooltip 的实际位置
            <div class="coordinates" id="debug-info"></div>
        </div>

        <table id="split-table">
            <thead>
                <tr>
                    <th>分段</th>
                    <th>配速</th>
                    <th>累计时间</th>
                </tr>
            </thead>
            <tbody>
                <tr data-split="Pre 1-3">
                    <td>Pre 1-3 km</td>
                    <td>5:30 /km</td>
                    <td>0:16:30</td>
                </tr>
                <tr data-split="Pre 4-6">
                    <td>Pre 4-6 km</td>
                    <td>5:25 /km</td>
                    <td>0:33:00</td>
                </tr>
                <tr data-split="Pre 7-10">
                    <td>Pre 7-10 km</td>
                    <td>5:20 /km</td>
                    <td>0:49:00</td>
                </tr>
                <tr data-split="11-15">
                    <td>11-15 km</td>
                    <td>5:15 /km</td>
                    <td>1:14:15</td>
                </tr>
                <tr data-split="16-21">
                    <td>16-21 km</td>
                    <td>5:10 /km</td>
                    <td>1:40:30</td>
                </tr>
            </tbody>
        </table>

        <div id="tooltip" class="tooltip" style="display: none;">
            <div class="tooltip-title" id="tooltip-title">分段信息</div>
            <div class="tooltip-content">
                <div>RPE: 13 (轻松)</div>
                <div>呼吸: 鼻吸鼻呼</div>
                <div>心率区间: Z2 (有氧)</div>
            </div>
        </div>
    </div>

    <script>
        const tooltip = document.getElementById('tooltip');
        const tooltipTitle = document.getElementById('tooltip-title');
        const debugInfo = document.getElementById('debug-info');
        const table = document.getElementById('split-table');

        table.addEventListener('click', (e) => {
            const row = e.target.closest('tr');
            if (!row || !row.dataset.split) return;

            const rect = row.getBoundingClientRect();
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;

            // 当前代码使用的定位方式
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            // 显示 tooltip
            tooltip.style.display = 'block';
            tooltip.style.left = x + 'px';
            tooltip.style.top = y + 'px';
            tooltip.style.transform = 'translate(-50%, -50%)';

            tooltipTitle.textContent = row.dataset.split;

            // 调试信息
            debugInfo.innerHTML = `
                行的矩形: top=${rect.top.toFixed(0)}, left=${rect.left.toFixed(0)},
                width=${rect.width.toFixed(0)}, height=${rect.height.toFixed(0)}<br>
                Tooltip位置: x=${x.toFixed(0)}, y=${y.toFixed(0)}<br>
                实际top: ${y.toFixed(0)} (transform: -50%)<br>
                窗口滚动: scrollTop=${scrollTop.toFixed(0)}, scrollLeft=${scrollLeft.toFixed(0)}
            `;
        });

        // 点击其他地方关闭
        document.addEventListener('click', (e) => {
            if (!e.target.closest('tr')) {
                tooltip.style.display = 'none';
            }
        });
    </script>
</body>
</html>
